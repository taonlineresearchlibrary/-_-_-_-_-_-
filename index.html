<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정밀 모형로켓 시뮬레이터 (전체 보기 수정)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: flex; gap: 20px; }
        .left-panel { flex: 1.2; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .part-card { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 10px; border-radius: 6px; position: relative; }
        .input-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .input-item { display: flex; flex-direction: column; font-size: 12px; }
        .status-box { background: #e9ecef; padding: 20px; border-radius: 8px; text-align: center; }
        /* 캔버스 높이 확보 및 중앙 정렬 */
        canvas { background: #fff; border: 1px solid #ccc; border-radius: 8px; width: 100%; height: 600px; }
        button { padding: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <h1>🛠️ 로켓 설계</h1>
        <select id="partType">
            <option value="body">몸체</option>
            <option value="nosecone">노즈콘</option>
            <option value="fin">사다리꼴 날개</option>
            <option value="motor">모터</option>
            <option value="payload">페이로드(추가물체)</option>
        </select>
        <button onclick="addPart()">+ 부품 추가</button>
        <div id="partList"></div>
    </div>

    <div class="right-panel">
        <div class="status-box">
            <h3>비행 안정성 결과</h3>
            <p>CG: <span id="resCG">0</span>mm | CP: <span id="resCP">0</span>mm</p>
            <h2 id="resCaliber">Caliber: 0.00</h2>
            <div id="resStatus">데이터 입력 대기 중</div>
        </div>
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    const templates = {
        'body': { name: '몸체', fields: { w: '무게(g)', y: '위치(mm)', d: '지름(mm)', l: '길이(mm)' }, d: {w: 40, y: 0, d: 30, l: 250} },
        'nosecone': { name: '노즈콘', fields: { w: '무게(g)', y: '위치(mm)', d: '지름(mm)', l: '길이(mm)' }, d: {w: 15, y: 250, d: 30, l: 70} },
        'fin': { name: '날개', fields: { w: '무게(g)', y: '위치(mm)', count: '개수', span: '폭(mm)', root: '뿌리(mm)', tip: '끝(mm)', sweep: '후퇴(mm)' }, d: {w: 10, y: 0, count: 4, span: 35, root: 50, tip: 20, sweep: 25} },
        'motor': { name: '모터', fields: { w: '무게(g)', y: '위치(mm)', d: '지름(mm)', l: '길이(mm)' }, d: {w: 40, y: -5, d: 18, l: 70} },
        'payload': { name: '페이로드', fields: { w: '무게(g)', y: '위치(mm)', width: '가로(mm)', height: '세로(mm)' }, d: {w: 50, y: 150, width: 20, height: 20} }
    };

    let parts = []; let uid = 0;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function addPart() {
        const type = document.getElementById('partType').value;
        parts.push({ id: ++uid, type, ...templates[type].d });
        render();
    }

    function removePart(id) { parts = parts.filter(p => p.id !== id); render(); }

    function update(id, key, val) {
        const p = parts.find(x => x.id === id);
        if (p) { p[key] = parseFloat(val) || 0; calculate(); }
    }

    function calculate() {
        let W = 0, sumCG = 0, sumCN = 0, sumCP = 0, maxD = 30;
        let maxY = 500; // 기본 캔버스 길이
        
        parts.forEach(p => {
            let weight = p.w;
            let cg = p.y;
            let len = p.l || p.height || 0;
            if (p.type === 'body') cg += len / 2;
            else if (p.type === 'nosecone') cg += len * 0.4;
            else if (p.type === 'motor') cg += len / 2;
            else if (p.type === 'fin') cg += p.root * 0.4;
            else if (p.type === 'payload') cg += len / 2;
            
            W += weight;
            sumCG += (weight * cg);

            if (p.type === 'fin') {
                let cn = 4 * p.count * Math.pow((p.span || 0) / maxD, 2);
                sumCN += cn;
                sumCP += (cn * p.y);
            }
            // 로켓의 최대 길이 추적
            if (p.y + len > maxY) maxY = p.y + len + 50;
        });

        const CG = W > 0 ? sumCG / W : 0;
        const CP = sumCN > 0 ? sumCP / sumCN : 0;
        const cal = (CG - CP) / maxD;

        document.getElementById('resCG').innerText = CG.toFixed(1);
        document.getElementById('resCP').innerText = CP.toFixed(1);
        document.getElementById('resCaliber').innerText = `Caliber: ${cal.toFixed(2)}`;
        
        const resStatus = document.getElementById('resStatus');
        if (cal >= 1.0) { resStatus.innerText = "✅ 안정적"; resStatus.style.color = "green"; }
        else { resStatus.innerText = "🚨 불안정!"; resStatus.style.color = "red"; }
        
        draw(CG, CP, maxY);
    }

    function draw(cg, cp, totalH) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 스케일 계산: 캔버스 높이에 맞춰 로켓이 꽉 차게 그림
        const scale = 550 / totalH;
        
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        
        // 로켓 몸체 그리기 (좌표 조정)
        ctx.strokeRect(150, 580 - (totalH * scale), 40, totalH * scale);
        
        // CG 표시
        ctx.fillStyle = 'blue';
        ctx.fillRect(100, 580 - (cg * scale), 140, 3);
        ctx.fillText("CG (" + cg.toFixed(0) + "mm)", 100, 580 - (cg * scale) - 5);

        // CP 표시
        ctx.fillStyle = 'red';
        ctx.fillRect(100, 580 - (cp * scale), 140, 3);
        ctx.fillText("CP (" + cp.toFixed(0) + "mm)", 100, 580 - (cp * scale) + 15);
    }

    function render() {
        const list = document.getElementById('partList');
        list.innerHTML = '';
        parts.forEach(p => {
            let html = `<div class="part-card"><strong>${templates[p.type].name}</strong> <button onclick="removePart(${p.id})">삭제</button><div class="input-grid">`;
            for (let f in templates[p.type].fields) {
                html += `<div class="input-item"><label>${templates[p.type].fields[f]}</label><input type="number" value="${p[f]}" oninput="update(${p.id}, '${f}', this.value)"></div>`;
            }
            list.innerHTML += html + `</div></div>`;
        });
        calculate();
    }
</script>
</body>
</html>
